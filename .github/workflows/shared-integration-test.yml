name: Shared integration-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration-test:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          node: 'false'

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Check live Steam API contracts
        run: task test:steam-integration
