# This should build a beta build of the decky-plugin

name: Beta

on:
  push:
    branches: [ "beta" ]
  pull_request:
    branches: [ "beta" ]
  workflow_dispatch: # The "Manual" button to trigger a beta release

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  WAILS_VERSION: v3.0.0-beta.10

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            decky-plugin/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Run tests
        run: go test ./backend/... ./cmd/decky -v -short -coverprofile=coverage.out

  build-check:
    needs: test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            decky-plugin/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libgtk-4-dev libwebkitgtk-6.0-dev libgirepository1.0-dev librsvg2-dev xvfb xauth dbus-x11

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build Check
        run: task linux:build

      - name: Build AppImage
        run: APP_VERSION=ci task linux:create:appimage

      - name: Smoke test AppImage
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find bin -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$artifact"
          chmod +x "$artifact"
          set +e
          dbus-run-session -- xvfb-run -a timeout 10s "$artifact" --appimage-extract-and-run
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

      - name: Install decky-plugin dependencies
        run: task linux:decky:install:deps

      - name: Build decky plugin
        run: task linux:decky:package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            bin/*.AppImage
          retention-days: 30

      - name: Upload decky build artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-plugin
          path: bin/sentinel-decky-plugin.zip
          retention-days: 30

  semantic-dry-run:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            decky-plugin/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Semantic Release Dry Run
        run: npm run release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  beta:
    # This job ONLY runs when you manually click "Run Workflow" in Actions tab
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify beta branch
        if: github.ref != 'refs/heads/beta'
        run: |
          echo "::error::This workflow must be dispatched from the 'beta' branch (current ref: ${{ github.ref }}). Re-run with branch 'beta' selected."
          exit 1

      - name: Generate Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            decky-plugin/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Install GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libgtk-4-dev libwebkitgtk-6.0-dev libgirepository1.0-dev librsvg2-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build Go binary
        run: task linux:build

      - name: Install decky-plugin dependencies
        run: task linux:decky:install:deps

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload decky build artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-plugin
          path: bin/sentinel-decky-plugin.zip
          retention-days: 30
