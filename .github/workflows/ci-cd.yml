name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # The "Manual" button to trigger a release

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/shared-test.yml

  integration-test:
    needs: test
    uses: ./.github/workflows/shared-integration-test.yml

  build-check:
    needs: test
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/shared-build-check.yml

  semantic-dry-run:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            decky-plugin/package-lock.json
            gnome-extension/package-lock.json

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Semantic Release Dry Run
        run: npm run release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    # This job ONLY runs when you manually click "Run Workflow" in Actions tab
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must be dispatched from the 'main' branch (current ref: ${{ github.ref }}). Re-run with branch 'main' selected."
          exit 1

      - name: Generate Token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            decky-plugin/package-lock.json
            gnome-extension/package-lock.json

      - name: Set up Linux builds
        uses: ./.github/actions/setup-linux-build
        with:
          packaging: 'true'

      - name: Build Go binary
        run: task linux:build

      - name: Install decky-plugin dependencies
        run: task linux:decky:install:deps

      - name: Install semantic-release dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Semantic Release
        run: npm run release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Upload decky build artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-plugin
          path: bin/*decky-plugin-*.zip
          retention-days: 30
