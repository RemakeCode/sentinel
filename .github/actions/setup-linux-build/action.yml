name: Set up Linux builds
description: Install desktop build dependencies, Wails, and notification tooling.
inputs:
  packaging:
    description: Whether to install Flatpak and release packaging dependencies.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install desktop dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libasound2-dev libgtk-3-dev libgtk-4-dev libwebkit2gtk-4.1-dev libwebkitgtk-6.0-dev

    - name: Install packaging dependencies
      if: inputs.packaging == 'true'
      shell: bash
      run: |
        sudo apt-get install -y flatpak flatpak-builder libarchive-tools libnotify-bin
        flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

    - name: Install Wails CLI
      shell: bash
      env:
        WAILS_VERSION: v3.0.0-beta.23
      run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

    - name: Set up notification builds
      uses: ./.github/actions/setup-notification-build
